<html lang="en">
<head>
<meta charset="utf-8">

<title>SSAT Practice Set 3</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#1f2328;--muted:#5d6670;--line:#dcd7cc;--accent:#1f5f8b;--accent-soft:#e3eef6;--good:#2e7d32;--mid:#a06a00;--bad:#b23b3b;--pick-ink:#fff;--passage:#fbfaf6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181b;--card:#1f2226;--ink:#e8e6e1;--muted:#a3a9b0;--line:#3a3e44;--accent:#7db4dd;--accent-soft:#22313d;--good:#7fc884;--mid:#e0b45a;--bad:#ec8a8a;--pick-ink:#10141a;--passage:#1b1d21}}
:root[data-theme="dark"]{--bg:#16181b;--card:#1f2226;--ink:#e8e6e1;--muted:#a3a9b0;--line:#3a3e44;--accent:#7db4dd;--accent-soft:#22313d;--good:#7fc884;--mid:#e0b45a;--bad:#ec8a8a;--pick-ink:#10141a;--passage:#1b1d21}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 80px}
header.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 8px;margin-bottom:12px}
.toprow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
h1{font-size:1.45rem;margin:0}.saveline{color:var(--muted);font-size:.9rem;margin:2px 0 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem;min-width:4.5em;text-align:center}
button{font:inherit;font-size:.95rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;-webkit-appearance:none}
button.primary{background:var(--accent);color:var(--pick-ink);border-color:var(--accent)}
nav.parts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
nav.parts a{font-size:.85rem;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--card)}
section.part{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:18px 0;scroll-margin-top:130px}
section.part h2{margin:0 0 4px;font-size:1.2rem}
.psub{color:var(--muted);font-size:.95rem;margin:0 0 10px;font-style:italic}
.tip{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:10px 0 4px;font-size:.95rem}
.tip ol{margin:4px 0 0;padding-left:1.3em}
label.small{display:block;font-size:.85rem;color:var(--muted);margin:8px 0 3px}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:60px;resize:vertical}
.chunk{display:grid;grid-template-columns:1fr 250px;gap:14px;border-top:1px solid var(--line);padding:12px 0}
.chunk:first-of-type{border-top:none}
.ptext{background:var(--passage);border-left:3px solid var(--line);padding:8px 12px;border-radius:4px;margin:0}
.q{border-top:1px solid var(--line);padding:14px 0}
.qtext{font-weight:600;margin:0 0 6px}
.opts{list-style:none;padding:0;margin:10px 0 0}
.opt{display:flex;align-items:flex-start;gap:8px;padding:6px 4px;border-radius:8px}
.opt.isbest{background:var(--accent-soft)}
.letter{flex:0 0 auto;width:2em;height:2em;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;padding:0;display:flex;align-items:center;justify-content:center}
.opt.isbest .letter{background:var(--accent);color:var(--pick-ink);border-color:var(--accent)}
.otext{flex:1;padding-top:3px}.otext.crossed{text-decoration:line-through;color:var(--muted)}
.marks{flex:0 0 auto;display:flex;gap:4px}
.mk{width:2.1em;height:2em;padding:0;font-weight:700}
.mk.on.plus{background:var(--good);border-color:var(--good);color:var(--pick-ink)}
.mk.on.slash{background:var(--mid);border-color:var(--mid);color:var(--pick-ink)}
.mk.on.minus{background:var(--bad);border-color:var(--bad);color:var(--pick-ink)}
.fb{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:.93rem;background:var(--passage);border-left:3px solid var(--line)}.fb.ok{border-left-color:var(--good)}.fb.no{border-left-color:var(--bad)}.opt.right .otext{font-weight:700;color:var(--good)}.exchk{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}.exscore{font-weight:600}
.locked .letter,.locked .mk{pointer-events:none;opacity:.85}
.howto{font-size:.85rem;color:var(--muted);margin-top:4px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.95rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.show{opacity:1}#copybox{display:none;margin-top:10px}
@media (max-width:720px){.chunk{grid-template-columns:1fr}.opt{flex-wrap:wrap}.marks{width:100%;justify-content:flex-end}h1{font-size:1.2rem}}
.ptext.poem{white-space:normal;line-height:1.7}.wp{margin:6px 0;cursor:default}textarea.essay{min-height:340px;line-height:1.6}
</style>

var KEY="ssat-practice-set-3-v1";
var SECS=[{"id": "S", "name": "Synonyms", "type": "syn", "qs": [{"n": 1, "s": "ABSTRUSE", "o": ["sudden", "obscure", "absent", "rude", "shallow"], "a": 1, "e": "Abstruse means hard to understand. “Abrupt” and “absent” only look similar."}, {"n": 2, "s": "AMELIORATE", "o": ["improve", "delay", "worsen", "measure", "admire"], "a": 0, "e": "From Latin melior, “better”: to ameliorate is to make better. “Worsen” is the opposite trap."}, {"n": 3, "s": "ASSIDUOUS", "o": ["quick-witted", "secretive", "lazy", "diligent", "sour"], "a": 3, "e": "An assiduous student works steadily and carefully. “Lazy” is the opposite."}, {"n": 4, "s": "BELLIGERENT", "o": ["sluggish", "hostile", "beautiful", "wealthy", "noisy"], "a": 1, "e": "Belligerent means eager to fight (bellum, “war”). “Beautiful” is a trap from French belle."}, {"n": 5, "s": "BOMBASTIC", "o": ["modest", "silent", "explosive", "brutal", "pompous"], "a": 4, "e": "Bombastic speech is inflated and showy. “Explosive” is a look-alike trap from “bomb.”"}, {"n": 6, "s": "CASTIGATE", "o": ["discard", "separate", "imprison", "scold", "build"], "a": 3, "e": "To castigate is to criticize or scold severely."}, {"n": 7, "s": "CIRCUMSPECT", "o": ["cautious", "careless", "round", "suspicious", "curious"], "a": 0, "e": "Circumspect means looking around before acting, so cautious. “Round” is a trap from circum-."}, {"n": 8, "s": "CONVIVIAL", "o": ["persuasive", "illegal", "sociable", "sickly", "gloomy"], "a": 2, "e": "A convivial gathering is friendly and lively. “Persuasive” is a trap from “convince.”"}, {"n": 9, "s": "CREDULOUS", "o": ["gullible", "believable", "grateful", "trustworthy", "skeptical"], "a": 0, "e": "A credulous person believes things too easily. Don’t confuse it with “credible,” which means believable."}, {"n": 10, "s": "DEARTH", "o": ["death", "territory", "expense", "abundance", "scarcity"], "a": 4, "e": "A dearth is a shortage. “Death” only looks similar; “abundance” is the opposite."}, {"n": 11, "s": "DELETERIOUS", "o": ["harmful", "delayed", "beneficial", "delicious", "erased"], "a": 0, "e": "Deleterious means damaging. “Beneficial” is the opposite."}, {"n": 12, "s": "EBULLIENT", "o": ["weary", "tidal", "exuberant", "bulky", "hostile"], "a": 2, "e": "An ebullient person bubbles over with enthusiasm."}, {"n": 13, "s": "ELUCIDATE", "o": ["confuse", "escape", "clarify", "celebrate", "lengthen"], "a": 2, "e": "To elucidate is to make clear (lucid). “Escape” is a trap from “elude.”"}, {"n": 14, "s": "EPHEMERAL", "o": ["elegant", "feverish", "eternal", "enormous", "fleeting"], "a": 4, "e": "Ephemeral things last a very short time. “Eternal” is the opposite."}, {"n": 15, "s": "EXTOL", "o": ["expel", "tax", "praise", "ignore", "demand"], "a": 2, "e": "To extol is to praise highly. “Demand” is a trap from “extort.”"}, {"n": 16, "s": "FASTIDIOUS", "o": ["sloppy", "fussy", "stubborn", "hungry", "speedy"], "a": 1, "e": "Fastidious means very particular about details. “Speedy” is a trap from “fast.”"}, {"n": 17, "s": "IMPECUNIOUS", "o": ["rude", "impatient", "spotless", "penniless", "wealthy"], "a": 3, "e": "Impecunious means having little money. “Spotless” is a trap from “impeccable.”"}, {"n": 18, "s": "INCORRIGIBLE", "o": ["fragile", "beyond reform", "obedient", "invisible", "incorrect"], "a": 1, "e": "An incorrigible person cannot be corrected or reformed."}, {"n": 19, "s": "INDEFATIGABLE", "o": ["indifferent", "tireless", "undefeated", "exhausted", "unclear"], "a": 1, "e": "Indefatigable means never getting tired (fatigue). “Undefeated” is a look-alike trap."}, {"n": 20, "s": "INNOCUOUS", "o": ["guilty", "injected", "harmless", "noticeable", "venomous"], "a": 2, "e": "Innocuous means not harmful or offensive. “Venomous” is the opposite."}, {"n": 21, "s": "LAMENT", "o": ["borrow", "coat", "mourn", "lighten", "celebrate"], "a": 2, "e": "To lament is to express grief. “Coat” is a trap from “laminate.”"}, {"n": 22, "s": "OSTENTATIOUS", "o": ["modest", "showy", "outdated", "nervous", "exiled"], "a": 1, "e": "Ostentatious means designed to impress. “Modest” is the opposite."}, {"n": 23, "s": "PARSIMONIOUS", "o": ["partial", "precise", "stingy", "lavish", "religious"], "a": 2, "e": "A parsimonious person hates to spend. “Lavish” is the opposite."}, {"n": 24, "s": "PENCHANT", "o": ["fondness", "dislike", "punishment", "sorrow", "necklace"], "a": 0, "e": "A penchant is a strong liking. “Necklace” is a trap from “pendant.”"}, {"n": 25, "s": "PROSAIC", "o": ["imaginative", "dull", "wordy", "generous", "forward-thinking"], "a": 1, "e": "Prosaic means ordinary and unimaginative. “Imaginative” is the opposite."}, {"n": 26, "s": "QUERULOUS", "o": ["royal", "curious", "cheerful", "complaining", "questioning"], "a": 3, "e": "A querulous person whines and complains. “Questioning” is a trap from “query.”"}, {"n": 27, "s": "SANGUINE", "o": ["sanitary", "gloomy", "fierce", "saintly", "hopeful"], "a": 4, "e": "Sanguine means cheerfully optimistic. “Gloomy” is the opposite."}, {"n": 28, "s": "SURREPTITIOUS", "o": ["secret", "repetitive", "surprising", "open", "sudden"], "a": 0, "e": "Surreptitious means done secretly. “Open” is the opposite."}, {"n": 29, "s": "VENERATE", "o": ["ventilate", "revere", "poison", "despise", "vary"], "a": 1, "e": "To venerate is to respect deeply. “Poison” is a trap from “venom.”"}, {"n": 30, "s": "ACQUIESCE", "o": ["comply", "acquire", "resist", "accuse", "quiet down"], "a": 0, "e": "To acquiesce is to accept or go along without protest. “Acquire” and “quiet” are look-alike traps."}]}, {"id": "A", "name": "Analogies", "type": "ana", "qs": [{"n": 31, "s": "Lethargic is to energy as destitute is to", "o": ["home", "poverty", "patience", "health", "money"], "a": 4, "e": "Sentence: someone lethargic lacks energy. A destitute person lacks money. “Poverty” is what a destitute person has, not what they lack."}, {"n": 32, "s": "Archipelago is to island as constellation is to", "o": ["star", "telescope", "planet", "ocean", "sky"], "a": 0, "e": "An archipelago is a group of islands, and a constellation is a group of stars."}, {"n": 33, "s": "Gavel is to judge as", "o": ["podium : audience", "baton : conductor", "scalpel : wound", "hammer : nail", "stethoscope : patient"], "a": 1, "e": "A gavel is a tool used by a judge, and a baton is a tool used by a conductor. In “stethoscope : patient,” the person is the one it’s used on, not the user."}, {"n": 34, "s": "Embezzle is to money as plagiarize is to", "o": ["crime", "author", "library", "words", "lawyer"], "a": 3, "e": "To embezzle is to steal money; to plagiarize is to steal someone’s words or ideas."}, {"n": 35, "s": "Amnesia is to memory as insomnia is to", "o": ["night", "fatigue", "sleep", "dream", "doctor"], "a": 2, "e": "Amnesia is a loss of memory; insomnia is a loss of sleep. Fatigue is a result of insomnia, not what is missing."}, {"n": 36, "s": "Frugal is to miserly as brave is to", "o": ["fearful", "admired", "cowardly", "bold", "reckless"], "a": 4, "e": "Miserly is frugal taken to a bad extreme; reckless is bravery taken to a bad extreme. “Bold” is just a synonym, not an extreme."}, {"n": 37, "s": "Granary is to grain as arsenal is to", "o": ["farms", "battles", "soldiers", "weapons", "gold"], "a": 3, "e": "A granary stores grain; an arsenal stores weapons."}, {"n": 38, "s": "Entomologist is to insects as", "o": ["ornithologist : birds", "botanist : gardener", "astronomer : telescope", "historian : museum", "zoologist : cage"], "a": 0, "e": "An entomologist studies insects; an ornithologist studies birds. The other pairs are a scientist and a tool, place or person, not a subject studied."}, {"n": 39, "s": "Mollify is to anger as alleviate is to", "o": ["patience", "weight", "pain", "medicine", "joy"], "a": 2, "e": "To mollify anger is to ease it; to alleviate pain is to ease it."}, {"n": 40, "s": "Spurious is to genuine as transient is to", "o": ["traveling", "brief", "permanent", "modern", "false"], "a": 2, "e": "Spurious is the opposite of genuine; transient is the opposite of permanent. “Brief” is a synonym trap."}, {"n": 41, "s": "Loquacious is to talk as itinerant is to", "o": ["travel", "write", "rest", "listen", "settle"], "a": 0, "e": "A loquacious person talks a lot; an itinerant person travels a lot."}, {"n": 42, "s": "Overture is to opera as preamble is to", "o": ["constitution", "lawyer", "election", "ending", "music"], "a": 0, "e": "An overture opens an opera; a preamble opens a constitution."}, {"n": 43, "s": "Ravenous is to hungry as exhausted is to", "o": ["energetic", "restful", "starving", "tired", "busy"], "a": 3, "e": "Ravenous means extremely hungry; exhausted means extremely tired."}, {"n": 44, "s": "Rudder is to ship as", "o": ["captain : crew", "anchor : harbor", "engine : fuel", "sail : wind", "steering wheel : car"], "a": 4, "e": "A rudder steers a ship, and a steering wheel steers a car."}, {"n": 45, "s": "Inaudible is to hear as illegible is to", "o": ["print", "read", "sign", "write", "erase"], "a": 1, "e": "Something inaudible cannot be heard; something illegible cannot be read."}, {"n": 46, "s": "Saboteur is to undermine as mediator is to", "o": ["reconcile", "judge", "divide", "argue", "punish"], "a": 0, "e": "A saboteur’s job is to undermine; a mediator’s job is to reconcile two sides."}, {"n": 47, "s": "Crestfallen is to disappointment as elated is to", "o": ["sorrow", "surprise", "joy", "boredom", "height"], "a": 2, "e": "Crestfallen describes someone feeling disappointment; elated describes someone feeling joy."}, {"n": 48, "s": "Quarry is to stone as", "o": ["field : farmer", "well : bucket", "sea : ship", "mine : ore", "forest : axe"], "a": 3, "e": "Stone is dug out of a quarry, and ore is dug out of a mine."}, {"n": 49, "s": "Drought is to water as famine is to", "o": ["food", "rain", "farmer", "hunger", "desert"], "a": 0, "e": "A drought is a severe shortage of water; a famine is a severe shortage of food. Hunger is a result, not what is lacking."}, {"n": 50, "s": "Bark is to tree as scale is to", "o": ["music", "weight", "branch", "mountain", "fish"], "a": 4, "e": "Bark is the outer covering of a tree; scales cover a fish. “Weight” and “music” use other meanings of “scale.”"}, {"n": 51, "s": "Eulogy is to praise as tirade is to", "o": ["speech", "criticism", "silence", "applause", "funeral"], "a": 1, "e": "A eulogy is a speech full of praise; a tirade is a long, angry speech full of criticism. “Speech” is the category, not the content."}, {"n": 52, "s": "Wince is to pain as blush is to", "o": ["cheek", "cosmetics", "boredom", "red", "embarrassment"], "a": 4, "e": "People wince because of pain and blush because of embarrassment."}, {"n": 53, "s": "Dam is to river as", "o": ["boat : lake", "bridge : canyon", "barricade : street", "pipe : water", "map : road"], "a": 2, "e": "A dam blocks a river; a barricade blocks a street. A bridge crosses a canyon rather than blocking it."}, {"n": 54, "s": "Prune is to hedge as edit is to", "o": ["scissors", "gardener", "library", "author", "manuscript"], "a": 4, "e": "You prune a hedge to trim and improve it; you edit a manuscript to trim and improve it."}, {"n": 55, "s": "Cooper is to barrels as cobbler is to", "o": ["streets", "shoes", "stones", "dessert", "horses"], "a": 1, "e": "A cooper makes barrels; a cobbler makes and mends shoes. “Dessert” and “streets” are traps from peach cobbler and cobblestones."}, {"n": 56, "s": "Indelible is to erase as inevitable is to", "o": ["happen", "avoid", "ink", "expect", "fate"], "a": 1, "e": "Something indelible cannot be erased; something inevitable cannot be avoided."}, {"n": 57, "s": "Barometer is to pressure as", "o": ["scale : kitchen", "compass : map", "odometer : distance", "thermostat : furnace", "clock : alarm"], "a": 2, "e": "A barometer measures air pressure; an odometer measures distance."}, {"n": 58, "s": "Stanza is to poem as", "o": ["chapter : novel", "actor : stage", "author : book", "page : ink", "title : cover"], "a": 0, "e": "A stanza is a section of a poem; a chapter is a section of a novel."}, {"n": 59, "s": "Philatelist is to stamps as numismatist is to", "o": ["insects", "books", "numbers", "maps", "coins"], "a": 4, "e": "A philatelist collects stamps; a numismatist collects coins. “Numbers” is a look-alike trap."}, {"n": 60, "s": "Candor is to deceitful as diligence is to", "o": ["lazy", "careful", "hardworking", "honest", "patient"], "a": 0, "e": "A deceitful person lacks candor; a lazy person lacks diligence."}]}, {"id": "R1", "name": "Passage 1 · Fiction", "type": "read", "src": "", "poem": false, "paras": ["For three summers, Nadia had refused to set foot in her grandfather’s workshop. It smelled of oil and brass, and it was so crowded with half-finished clocks that every surface seemed to be ticking at a slightly different speed, as if the room could not agree on what time it was. Her grandfather never invited her in; he simply left the door open, the way one might leave a window open for a bird.", "The summer she turned fourteen, a storm knocked out the power for two days, and with nothing to charge and nowhere to go, she drifted to the doorway. He was hunched over a pocket watch no bigger than a cookie, its insides spread across a white cloth like the bones of some tiny animal. “This one belonged to a ferry captain,” he said without looking up. “It stopped the day he retired. His daughter wants it running again before his ninetieth birthday.”", "“Why does it matter if it runs?” Nadia asked. “Everyone has a phone.” Her grandfather turned a screw so small she could barely see it. “A phone tells you what time it is,” he said. “This tells him what time it was.”", "She did not understand him then. But she sat down on the stool beside him, and when he handed her the tweezers, she found that her hands, which were usually so restless, had gone perfectly still."], "qs": [{"n": 61, "s": "The comparison of the open door to “a window open for a bird” (paragraph 1) suggests that the grandfather", "o": ["kept pet birds in his workshop", "hoped Nadia would come in on her own, without being pushed", "did not care whether Nadia visited", "was afraid Nadia would damage the clocks", "wanted fresh air in the stuffy workshop"], "a": 1, "e": "You leave a window open so a bird can choose to come in. He gave her a way in without forcing her."}, {"n": 62, "s": "The description of clocks “ticking at a slightly different speed” mainly emphasizes", "o": ["Nadia’s fear of loud noises", "that every clock in the room was broken", "the grandfather’s lack of skill", "the crowded, slightly disorderly feel of the workshop", "that time seems to pass slowly in summer"], "a": 3, "e": "The image shows a busy, jumbled room. Nothing says he lacks skill; the clocks are “half-finished.”"}, {"n": 63, "s": "According to paragraph 2, Nadia goes to the workshop mainly because", "o": ["she had decided to learn clockmaking", "she wanted to inspect the storm damage", "the power outage left her with nothing else to do", "the ferry captain asked her to help", "her grandfather finally invited her"], "a": 2, "e": "“With nothing to charge and nowhere to go, she drifted to the doorway.” Paragraph 1 says he never invited her."}, {"n": 64, "s": "The grandfather’s statement “This tells him what time it was” suggests that the watch", "o": ["has been set to the wrong time", "stopped during the storm", "is more accurate than a phone", "is worth a great deal of money", "holds memories of the captain’s past"], "a": 4, "e": "“What time it was” points to the past: the watch reminds the captain of his working life."}, {"n": 65, "s": "The sentence “She did not understand him then” implies that Nadia", "o": ["never forgave her grandfather", "had misheard what he said", "was too shy to speak", "understood his meaning later in life", "strongly disagreed with him"], "a": 3, "e": "“Then” signals that her understanding came later."}, {"n": 66, "s": "The final sentence suggests that Nadia", "o": ["was worn out from the e itself guides the recruits, although scent helps them find the exact spot once they arrive.", "In 1973, von Frisch shared the Nobel Prize for his work. The bees, of course, had been dancing long before anyone was watching."], "qs": [{"n": 73, "s": "Which best states the main idea of the passage?", "o": ["Honeybees rely mainly on scent to find flowers.", "Honeybees use a dance to share where food is, a claim that was eventually confirmed.", "Von Frisch was the most famous scientist of his century.", "Robotic bees have replaced real bees in research.", "Bees are more intelligent than most animals."], "a": 1, "e": "The passage explains the dance, the doubts about it and how they were settled. Scent is only a helper at the end."}, {"n": 74, "s": "According to paragraph 2, a long waggle run tells other bees that the food is", "o": ["far from the hive", "in a very large patch", "guarded by enemies", "almost used up", "in the direction of the sun"], "a": 0, "e": "“The longer the waggle, the farther the flight.” Direction comes from the angle, not the length."}, {"n": 75, "s": "Based on paragraph 2, if a dancer’s straight run pointed straight down the comb, the other bees would most likely fly", "o": ["wherever the scent led them", "directly away from the sun", "directly toward the sun", "back toward the hive", "in a wide circle"], "a": 1, "e": "Straight up means toward the sun, so straight down means the opposite direction: away from it."}, {"n": 76, "s": "The question in paragraph 3 (“Could an insect … ?”) mainly serves to", "o": ["introduce a new experiment", "show that the author thinks bees are unintelligent", "describe a bee’s anatomy", "prove that von Frisch was wrong", "express the doubts of von Frisch’s critics"], "a": 4, "e": "It voices what the skeptics thought. The rest of the paragraph shows the doubt was answered."}, {"n": 77, "s": "Radar tracking and robotic bees are mentioned as", "o": ["reasons the dance was misunderstood", "technologies that harm bees",   function add(a,b){H.push(a);T.push(b);}
  var nm=(state.f.name||"").trim()||"(no name)";
  var dn=MC.filter(isChk),sc=score(dn),sline=state.done?("Score: "+sc.right+" of "+sc.total+" correct, "+sc.wrong+" wrong, "+sc.skip+" skipped. SSAT raw score: "+sc.raw):(dn.length?("Checked so far ("+dn.map(function(x){return x.name;}).join(", ")+"): "+sc.right+" of "+sc.total+" correct, "+sc.wrong+" wrong, "+sc.skip+" skipped. SSAT raw score: "+sc.raw):"Not checked yet (answers not scored).");
  add('<h2>SSAT Practice Set 3 — '+esc(nm)+'</h2><p>'+esc(date)+' · Time on timer: '+mins+' min</p><p><b>'+esc(sline)+'</b></p>',"SSAT Practice Set 3 — "+nm+"\n"+date+" · Time on timer: "+mins+" min\n"+sline);
  SECS.forEach(function(x){
    if(x.type==="write"){
      var pk=state.f.wpick,pr=(pk!==undefined&&pk!=="")?x.prompts[+pk]:null,es=(state.f.essay||"").trim();
      add('<h3>Writing Sample</h3><p><b>Prompt:</b> '+(pr?esc(pr.k+": "+pr.t):"(none chosen)")+'</p><p><b>Plan:</b><br>'+esc(v("wplan")).replace(/\n/g,"<br>")+'</p><p><b>Writing ('+words(es)+' words):</b></p>'+(es?es.split(/\n\s*\n|\n/).map(function(p){return '<p>'+esc(p)+'</p>';}).join(""):'<p>—</p>'),
          "\nWriting Sample\nPrompt: "+(pr?pr.k+": "+pr.t:"(none chosen)")+"\nPlan:\n"+v("wplan")+"\nWriting ("+words(es)+" words):\n"+(es||"—"));
      return;
    }
    add('<h3>'+esc(x.name)+'</h3>',"\n"+x.name);
    if(x.type==="read"){var notes=x.paras.map(function(p,i){return "¶"+(i+1)+": "+v(x.id+"-a"+(i+1));});
      add('<p><b>Annotations</b><br>'+notes.map(esc).join("<br>")+'<br>Main idea: '+esc(v(x.id+"-main"))+'</p>',"Annotations\n"+notes.join("\n")+"\nMain idea: "+v(x.id+"-main"));}
    x.qs.forEach(function(Q){
      var marks=Q.o.map(function(o,i){return L[i]+" "+(state.m[Q.n+L[i]]||"·");}).join("  "),best=state.b[Q.n]||"no answer";
      if(isChk(x))best+=(state.b[Q.n]===L[Q.a]?" ✓ correct":" ✗ (best answer "+L[Q.a]+")");
      var extra="",ext="";
      if(x.type==="ana"){extra='Sentence: '+esc(v("q"+Q.n+"-sent"))+'<br>';ext="\n   Sentence: "+v("q"+Q.n+"-sent");}
      if(x.type==="read"){extra='Prediction: '+esc(v("q"+Q.n+"-pred"))+'<br>';ext="\n   Prediction: "+v("q"+Q.n+"-pred");}
      add('<p><b>Q'+Q.n+'.</b> '+esc(Q.s)+'<br>'+extra+'Marks: '+esc(marks)+'<br>Answer: <b>'+esc(best)+'</b></p>',"Q"+Q.n+". "+Q.s+ext+"\n   Marks: "+marks+"\n   Answer: "+best);
    });
  });
  return{html:H.join(""),text:T.join("\n")};
}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.className="show";setTimeout(function(){t.className="";},2200);}
document.getElementById("copybtn").addEventListener("click",function(){
  var r=build(),ok=false;
  try{var d=document.createElement("div");d.setAttribute("contenteditable","true");d.style.position="fixed";d.style.left="-9999px";d.style.top="0";d.innerHTML=r.html;document.body.appendChild(d);
    var rg=document.createRange();rg.selectNodeContents(d);var s=window.getSelection();s.removeAllRanges();s.addRange(rg);ok=document.execCommand("copy");s.removeAllRanges();document.body.removeChild(d);}catch(e){ok=false;}
  if(ok){toast("Results copied. Paste them into your Google Doc.");document.getElementById("copybox").style.display="none";return;}
  function fb(){var b=document.getElementById("copybox"),ta=document.getElementById("copyfallback");ta.value=r.text;b.style.display="block";ta.focus();ta.select();}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(r.text).then(function(){toast("Results copied. Paste them into your Google Doc.");},fb);}else fb();
});
document.getElementById("dlbtn").addEventListener("click",function(){
  var r=build(),nm=((state.f.name||"").trim()||"student").replace(/[^A-Za-z0-9 _-]/g,""),d=new Date();
  var fn="SSAT Practice Set 3 - "+nm+" - "+d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+".doc";
  var doc='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>SSAT Practice Set 3</title></head><body style="font-family:Arial,sans-serif;font-size:11pt">'+r.html+'</body></html>';
  try{var blob=new Blob(["﻿",doc],{type:"application/msword"});
    var u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=fn;document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(u);},1500);
    toast("Saved to your Downloads folder.");
  }catch(e){var b=document.getElementById("copybox"),ta=document.getElementById("copyfallback");ta.value=r.text;b.style.display="block";ta.select();}
});
render();drawTimer();
})();
